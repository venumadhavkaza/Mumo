name: Build APK

on:
  push:
    branches:
      - master
      - claude/mobile-ios-android-optimize-ldd87u
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # AGP 7.0.x requires JDK 11.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Mumo.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mumo-debug-apk
          path: Mumo.apk

      # Each build becomes the "latest" release, so
      # https://github.com/<owner>/<repo>/releases/latest/download/Mumo.apk
      # always points at the newest APK.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mumo build ${{ github.run_number }}
          body: |
            Debug APK built from `${{ github.ref_name }}` @ ${{ github.sha }}.
            Download **Mumo.apk** below and open it on your Android phone to install.
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Mumo.apk
